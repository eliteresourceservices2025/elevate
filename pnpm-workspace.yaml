packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  sharp: false
  unrs-resolver: false
  esbuild: true
  protobufjs: false

overrides:
  # Security: patched versions of build/dev-time transitive packages (pnpm audit, Oct 2026)
  source-map-js: ">=1.2.2"
  body-parser: ">=2.4.0"
  systeminformation: ">=5.33.16"
  # pnpm audit, Nov 2026. gaxios 7.1.3 pulls rimraf > glob > minimatch with advisories; 7.1.4 dropped rimraf.
  hono: "^4.13.16"
  fast-uri: "^3.1.9"
  "gcp-metadata>gaxios": "^7.1.4"
  # drizzle-kit still loads a loader that pins esbuild 0.18 (pnpm audit, Nov 2026).
  "@esbuild-kit/core-utils>esbuild": "^0.25.4"
  # vitest's vite 8 line only (the tracker app stays on vite 7).
  "vite@>=8.0.0 <8.3.3": "^8.3.3"
