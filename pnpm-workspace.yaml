packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  sharp: false
  unrs-resolver: false
  esbuild: true
  protobufjs: false

overrides:
  # Security: patched versions of build/dev-time transitive packages (pnpm audit, Oct 2026)
  source-map-js: ">=1.2.2"
  body-parser: ">=2.4.0"
  systeminformation: ">=5.33.16"
