packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  sharp: false
  unrs-resolver: false
  esbuild: true
  protobufjs: false

overrides:
  # Security: patched versions of build/dev-time transitive packages (pnpm audit, Oct 2026)
  source-map-js: ">=1.2.2"
  body-parser: ">=2.4.0"
  systeminformation: ">=5.33.16"
  # pnpm audit, Nov 2026. gaxios 7.1.3 pulls rimraf > glob > minimatch with advisories; 7.1.4 dropped rimraf.
  hono: "^4.13.16"
  fast-uri: "^3.1.9"
  "gcp-metadata>gaxios": "^7.1.4"
