<h2 style="color:#3d1a6e;font-family:Arial,sans-serif">Reset your ELEVATE password</h2>
<p style="font-family:Arial,sans-serif">Use the button below to choose a new password. The link works once and expires soon.</p>
<p style="font-family:Arial,sans-serif">
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
     style="background:#8a2be2;color:#ffffff;padding:10px 18px;border-radius:8px;text-decoration:none">Choose a new password</a>
</p>
<p style="font-family:Arial,sans-serif;color:#695b93;font-size:13px">
  If you did not ask for this, you can ignore it. Your password has not changed.
</p>
