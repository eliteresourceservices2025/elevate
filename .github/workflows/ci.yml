name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Throwaway database for the integration tests. Fake data only, discarded with the runner.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Oct 2026 security releases (Brotli RCE CVE-2026-111497 and others): never run on an older patch.
      - name: Node is at least the patched version
        run: node -e "const [a,b,c]=process.versions.node.split('.').map(Number); if(a!==24||b<22||(b===22&&c<1)){console.error('Node '+process.version+' is older than 24.22.1');process.exit(1)}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
        env:
          TEST_DB_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Added later: schema/migration drift check, Playwright smoke tests.
