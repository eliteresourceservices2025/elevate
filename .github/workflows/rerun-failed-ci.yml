name: Re-run failed CI once

# Flaky failures (network, slow service start) often pass on a second try.
# This re-runs the failed jobs one time only; a failure that repeats is real.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: gh run rerun "$RUN_ID" --failed --repo "$REPO"
